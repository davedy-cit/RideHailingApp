<text x="68" y="1146" font-size="13" fill="#172b3a" font-weight="500" text-anchor="start">PK = primary key     FK = foreign key     UQ = unique constraint</text>
<text x="68" y="1171" font-size="13" fill="#5b6b7a" font-weight="400" text-anchor="start">Crow’s-foot branches mark the many side; labels show 1 = exactly one, 0..1 = optional one, and 0..* = zero or many. Ride.driver_id is nullable until assignment.</text>
